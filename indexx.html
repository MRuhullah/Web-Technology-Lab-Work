<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS POSITION</title>
    <style>
        .cont {
            margin-left: 90px;
        }

        .img {
            position: fixed;
            left: 30px;
            border: 1px solid bisque;
        }
    </style>
</head>

<body>
    <h1>CSS Position</h1>
    <div class="cont">
        <div class="img">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTDRXIJcMtUVnLvgwo7kXSNhcy8hdbDx9t2Fw&s">
            <img src="camera.jpg" alt="camera">
            <img src="images.jpg" alt="image">
            <img src="giraffe.webp" alt="firaffe">


        </div>


    </div>

</body>

</html>
