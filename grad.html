<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Circle</title>

    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
            margin: 0;
        }

        .circle {
            width: 300px;
            height: 300px;
            border-radius: 50%;

            background: conic-gradient(red,
                    orange,
                    yellow,
                    lime,
                    cyan,
                    blue,
                    indigo,
                    violet,
                    red);

            box-shadow:
                0 0 30px rgba(255, 255, 255, 0.4),
                0 0 60px rgba(255, 255, 255, 0.2);

            animation: rotate 5s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="circle"></div>

</body>

</html>
